<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEXT → UNIVERSE</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #020205;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
    }

    #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
    }

    #title {
        position: absolute;
        top: 30px;
        left: 35px;
        font-size: 11px;
        letter-spacing: 5px;
        opacity: .45;
    }

    #hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 2px;
        opacity: .35;
        text-align: center;
    }

    #input {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        max-width: 900px;
        background: transparent;
        border: none;
        outline: none;
        color: transparent;
        caret-color: transparent;
        text-align: center;
        font-size: 70px;
        z-index: 20;
        pointer-events: auto;
    }

    #word {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(45px, 10vw, 130px);
        font-weight: 900;
        letter-spacing: 8px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
    }

    #status {
        position: absolute;
        top: 30px;
        right: 35px;
        font-size: 10px;
        letter-spacing: 3px;
        opacity: .4;
    }
</style>
</head>

<body>

<div id="ui">
    <div id="title">TEXT → UNIVERSE</div>
    <div id="status">PARTICLE ENGINE / ONLINE</div>

    <input id="input" autofocus maxlength="18">

    <div id="word"></div>

    <div id="hint">
        TYPE SOMETHING · SPACE = EXPLODE · ENTER = REBUILD
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


// --------------------------------------------------
// BASIC SETUP
// --------------------------------------------------

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    2000
);

camera.position.z = 500;

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

document.body.appendChild(renderer.domElement);


// --------------------------------------------------
// PARTICLE SYSTEM
// --------------------------------------------------

const COUNT = 12000;

const positions = new Float32Array(COUNT * 3);
const targets = new Float32Array(COUNT * 3);
const velocities = new Float32Array(COUNT * 3);
const randomness = new Float32Array(COUNT * 3);

for (let i = 0; i < COUNT; i++) {

    const i3 = i * 3;

    const radius = 400 + Math.random() * 500;
    const angle = Math.random() * Math.PI * 2;

    positions[i3] =
        Math.cos(angle) * radius;

    positions[i3 + 1] =
        Math.sin(angle) * radius;

    positions[i3 + 2] =
        (Math.random() - .5) * 700;

    targets[i3] = positions[i3];
    targets[i3 + 1] = positions[i3 + 1];
    targets[i3 + 2] = positions[i3 + 2];

    randomness[i3] = Math.random();
    randomness[i3 + 1] = Math.random();
    randomness[i3 + 2] = Math.random();
}

const geometry = new THREE.BufferGeometry();

geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
);

const material = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 2.2,
    transparent: true,
    opacity: .85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});

const particles = new THREE.Points(
    geometry,
    material
);

scene.add(particles);


// --------------------------------------------------
// TEXT → PARTICLE POSITIONS
// --------------------------------------------------

const textCanvas = document.createElement("canvas");
const ctx = textCanvas.getContext("2d");

textCanvas.width = 1000;
textCanvas.height = 300;

function createTextTargets(text) {

    ctx.clearRect(
        0,
        0,
        textCanvas.width,
        textCanvas.height
    );

    ctx.fillStyle = "white";

    ctx.font =
        "900 150px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        text || "TYPE",
        500,
        150
    );

    const data = ctx.getImageData(
        0,
        0,
        textCanvas.width,
        textCanvas.height
    ).data;

    const points = [];

    for (
        let y = 0;
        y < textCanvas.height;
        y += 4
    ) {

        for (
            let x = 0;
            x < textCanvas.width;
            x += 4
        ) {

            const index =
                (y * textCanvas.width + x) * 4;

            if (data[index + 3] > 100) {

                points.push({
                    x: x - 500,
                    y: 150 - y
                });

            }
        }
    }

    for (let i = 0; i < COUNT; i++) {

        const i3 = i * 3;

        if (points.length > 0) {

            const p =
                points[i % points.length];

            const spread =
                1.15;

            targets[i3] =
                p.x * spread;

            targets[i3 + 1] =
                p.y * spread;

            targets[i3 + 2] =
                (Math.random() - .5) * 20;

        }
    }
}


// --------------------------------------------------
// EXPLOSION
// --------------------------------------------------

function explode() {

    for (let i = 0; i < COUNT; i++) {

        const i3 = i * 3;

        const x = positions[i3];
        const y = positions[i3 + 1];
        const z = positions[i3 + 2];

        const length =
            Math.sqrt(x*x + y*y + z*z) || 1;

        const power =
            5 + Math.random() * 15;

        velocities[i3] =
            x / length * power;

        velocities[i3 + 1] =
            y / length * power;

        velocities[i3 + 2] =
            z / length * power;
    }
}


// --------------------------------------------------
// INPUT
// --------------------------------------------------

const input =
    document.getElementById("input");

input.value = "AVIRAL";

createTextTargets(input.value);

input.addEventListener(
    "input",
    () => {

        createTextTargets(
            input.value
        );

    }
);

input.addEventListener(
    "keydown",
    e => {

        if (e.code === "Space") {

            e.preventDefault();

            explode();
        }

        if (e.code === "Enter") {

            createTextTargets(
                input.value
            );
        }

    }
);


// --------------------------------------------------
// MOUSE
// --------------------------------------------------

const mouse = {
    x: 0,
    y: 0
};

window.addEventListener(
    "pointermove",
    e => {

        mouse.x =
            (e.clientX / innerWidth - .5) * 2;

        mouse.y =
            (e.clientY / innerHeight - .5) * 2;

    }
);


// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const time =
        clock.getElapsedTime();

    for (let i = 0; i < COUNT; i++) {

        const i3 = i * 3;

        // Target attraction
        const dx =
            targets[i3] -
            positions[i3];

        const dy =
            targets[i3 + 1] -
            positions[i3 + 1];

        const dz =
            targets[i3 + 2] -
            positions[i3 + 2];

        positions[i3] +=
            dx * .045;

        positions[i3 + 1] +=
            dy * .045;

        positions[i3 + 2] +=
            dz * .045;


        // Floating motion
        positions[i3] +=
            Math.sin(
                time * .7 +
                randomness[i3] * 20
            ) * .025;

        positions[i3 + 1] +=
            Math.cos(
                time * .8 +
                randomness[i3 + 1] * 20
            ) * .025;


        // Explosion velocity
        positions[i3] +=
            velocities[i3];

        positions[i3 + 1] +=
            velocities[i3 + 1];

        positions[i3 + 2] +=
            velocities[i3 + 2];

        velocities[i3] *= .94;
        velocities[i3 + 1] *= .94;
        velocities[i3 + 2] *= .94;
    }

    geometry.attributes.position.needsUpdate = true;


    // Whole universe rotation
    particles.rotation.y +=
        .0007;

    particles.rotation.x =
        mouse.y * .08;

    particles.rotation.z =
        mouse.x * .05;


    // Camera reacts to mouse
    camera.position.x +=
        (mouse.x * 70 -
        camera.position.x) * .025;

    camera.position.y +=
        (-mouse.y * 40 -
        camera.position.y) * .025;

    camera.lookAt(0,0,0);


    renderer.render(
        scene,
        camera
    );
}

animate();


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
